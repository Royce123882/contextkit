[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextkit"
version = "0.1.0"
description = "A context engineering SDK for building reliable AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Royce", email = "royce@example.com"}
]
keywords = [
    "context-engineering", "llm", "ai-agents",
    "prompt-engineering", "rag", "memory"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.7.0",
    "pydantic>=2.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19.0"]
chroma = ["chromadb>=0.5.0"]
qdrant = ["qdrant-client>=1.6.1"]
pgvector = ["asyncpg>=0.29.0"]
pinecone = ["pinecone>=3.0.0"]
templates = ["Jinja2>=3.1"]
all = ["contextkit[sqlite,chroma,qdrant,pgvector,pinecone,templates]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "aiosqlite>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/Royce123882/contextkit"
Documentation = "https://contextkit.readthedocs.io"
Repository = "https://github.com/Royce123882/contextkit"
Issues = "https://github.com/Royce123882/contextkit/issues"
Changelog = "https://github.com/Royce123882/contextkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contextkit"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "D",    # pydocstyle (docstrings)
    "RUF",  # ruff-specific rules
]
ignore = [
    "D100",   # Missing module docstring (we use file-level docstrings)
    "D104",   # Missing public package docstring
    "D203",   # Blank line before class docstring (conflicts with D211)
    "D213",   # Multi-line summary second line (conflicts with D212)
    "D413",   # Missing blank line after last section in docstring
    "D107",   # Missing docstring in __init__ (args in class docstring)
    "S101",   # Use of assert in tests is expected
    "S311",   # Pseudo-random number generators are fine for non-crypto
    "A002",   # Shadowing builtins like `format` is intentional
    "UP006",  # Use typing.Dict/List/Set/Tuple for explicit type annotations
    "UP035",  # Allow imports from typing module (Dict, List, Set, Tuple)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # No docstring enforcement in tests
    "S",      # Security warnings off in tests
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tiktoken", "cachetools", "aiosqlite",
    "qdrant_client", "chromadb", "asyncpg", "pinecone",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["contextkit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
