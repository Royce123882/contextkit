[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextkit"
version = "0.1.0"
description = "A context engineering SDK for building reliable AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Royce", email = "royce@example.com"}
]
keywords = [
    "context-engineering", "llm", "ai-agents",
    "prompt-engineering", "rag", "memory"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.7.0",
    "pydantic>=2.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19.0"]
chroma = ["chromadb>=0.5.0"]
templates = ["Jinja2>=3.1"]
all = ["contextkit[sqlite,chroma,templates]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Royce123882/contextkit"
Documentation = "https://contextkit.readthedocs.io"
Repository = "https://github.com/Royce123882/contextkit"
Issues = "https://github.com/Royce123882/contextkit/issues"
Changelog = "https://github.com/Royce123882/contextkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contextkit"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["contextkit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
